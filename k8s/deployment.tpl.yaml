apiVersion: apps/v1
kind: Deployment
metadata:
  name: bi-portal-__COLOR__
  labels:
    app: bi-portal
    color: __COLOR__
spec:
  replicas: __REPLICAS__
  selector:
    matchLabels:
      app: bi-portal
      color: __COLOR__
  template:
    metadata:
      labels:
        app: bi-portal
        color: __COLOR__
    spec:
      containers:
        - name: portal
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DEPLOY_COLOR
              value: "__COLOR__"
            - name: APP_VERSION
              value: "__VERSION__"
            - name: BREAK_RELEASE
              value: "__BREAK__"
            - name: POWERBI_EMBED_URL
              valueFrom:
                configMapKeyRef:
                  name: bi-config
                  key: POWERBI_EMBED_URL
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
