apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Baseline: one Deployment updated in place, behind its own Service on port 8081.
resources:
  - ../../base
  - service.yaml
nameSuffix: -naive
labels:
  - pairs:
      app: bi-portal-naive
    includeSelectors: true
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: bi-portal
      spec:
        strategy:
          type: Recreate
        template:
          spec:
            containers:
              - name: portal
                env:
                  - name: DEPLOY_COLOR
                    value: naive
