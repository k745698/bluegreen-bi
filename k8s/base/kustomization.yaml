apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
labels:
  - pairs:
      app: bi-portal
    includeSelectors: true
# Defaults so an overlay renders on its own; scripts/lib.sh replaces these per release.
configMapGenerator:
  - name: bi-release
    literals:
      - APP_VERSION=dev
      - BREAK_RELEASE=false
      - REPORT_ID=
      - REPORT_PAGE=
